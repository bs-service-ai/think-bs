<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Think BS</title>
<meta name="theme-color" content="#1c1f23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Think BS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
<header class="top">
  <div class="logo">Think <b>BS</b> <small>株式会社BSサービス</small></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="タイトル・メモ・タグを検索" aria-label="検索">
  </div>
  <div class="toggle" role="group" aria-label="表示切り替え">
    <button id="vCard" type="button" aria-pressed="true" title="カード表示">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>カード</span></button>
    <button id="vList" type="button" aria-pressed="false" title="リスト表示">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>リスト</span></button>
  </div>
  <button class="sync" id="syncBtn" type="button" data-state="local">
    <span class="dot"></span><span id="syncText">端末内に保存</span>
  </button>
</header>

<div class="mobilebar">
  <div class="scrollrow" id="mFolders" aria-label="フォルダ"></div>
  <div class="scrollrow" id="mTags" aria-label="タグ"></div>
</div>

<div class="layout">
  <aside class="side">
    <div><div class="sidehead"><h2>Folders</h2><button type="button" class="linkbtn" id="sideManage">編集</button></div><div class="navlist" id="folders"></div></div>
    <div><h2>Tags</h2><div class="tagcloud" id="tags"></div></div>
  </aside>
  <main class="content">
    <div class="listhead">
      <div><h1 id="heading">すべてのアイデア</h1><div class="count" id="count"></div></div>
      <div class="filters" id="activeFilters"></div>
    </div>
    <div id="items"></div>
  </main>
</div>

<button class="fab" id="fab" type="button">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>新規
</button>
</div>

<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="fileAdd" accept="image/*" multiple hidden>

<!-- 新規:選択 -->
<div class="overlay" id="ovChoice" hidden>
  <div class="dialog small" role="dialog" aria-modal="true" aria-labelledby="chTitle">
    <div class="dhead"><h2 id="chTitle">新しいアイデア</h2><button class="iconbtn" type="button" data-close aria-label="閉じる">✕</button></div>
    <div class="dbody">
      <div class="choice">
        <button type="button" id="chPhoto">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          写真から<span>撮影・画像を選ぶ</span></button>
        <button type="button" id="chMemo">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h10l4 4v12H5z"/><path d="M8 11h8M8 15h6"/></svg>
          メモから<span>文字を先に入力</span></button>
      </div>
    </div>
  </div>
</div>

<!-- 編集 -->
<div class="overlay" id="ovEdit" hidden>
  <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="edTitle" id="edForm">
    <div class="dhead"><h2 id="edTitle">アイデアを登録</h2><button class="iconbtn" type="button" data-close aria-label="閉じる">✕</button></div>
    <div class="dbody">
      <label class="f" for="fTitle">タイトル
        <input class="inp" id="fTitle" required maxlength="80" placeholder="例:手動ポンプのレバー改良案"></label>
      <div class="two">
        <label class="f" for="fFolder">フォルダ
          <select class="inp" id="fFolder"></select></label>
        <label class="f" for="fNewFolder" id="newFolderWrap" hidden>新しいフォルダ名
          <input class="inp" id="fNewFolder" maxlength="30" placeholder="例:発電機メンテ"></label>
      </div>
      <div class="f"><span>画像(1件につき3枚まで)</span>
        <div class="imgslots" id="slots"></div>
        <p class="hint">スマホでは「カメラ」または「写真ライブラリ」から選べます。保存時に自動で縮小します。</p>
      </div>
      <div class="f">
        <div class="labelrow"><label for="fMemo">メモ</label>
          <button type="button" class="mic" id="micBtn" aria-pressed="false" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micText">音声入力</span></button>
        </div>
        <textarea class="inp" id="fMemo" placeholder="思いついたこと、気づいた点、次にやることなど"></textarea>
      </div>
      <div class="f"><span>タグ(Enterで追加)</span>
        <div class="chipsedit" id="tagEdit"><input id="fTag" list="tagList" placeholder="例:浄水器" aria-label="タグを追加"></div>
        <datalist id="tagList"></datalist>
      </div>
      <div class="f"><span>関連するアイデア</span>
        <div class="tagcloud" id="relEdit"></div>
        <select class="inp" id="fRel" aria-label="関連するアイデアを追加"></select>
      </div>
    </div>
    <div class="dfoot">
      <button class="btn danger" type="button" id="edDelete" hidden>削除</button>
      <span class="spacer"></span>
      <button class="btn" type="button" data-close>キャンセル</button>
      <button class="btn primary" type="submit">保存</button>
    </div>
  </form>
</div>

<!-- 詳細 -->
<div class="overlay" id="ovDetail" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dtTitle">
    <div class="dhead"><h2 id="dtTitle"></h2><button class="iconbtn" type="button" data-close aria-label="閉じる">✕</button></div>
    <div class="dbody" id="dtBody"></div>
    <div class="dfoot">
      <button class="btn" type="button" id="dtPrint">PDF・印刷</button>
      <span class="spacer"></span>
      <button class="btn primary" type="button" id="dtEdit">編集</button>
    </div>
  </div>
</div>

<!-- 削除の確認 -->
<div class="overlay" id="ovConfirm" hidden>
  <div class="dialog small" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
    <div class="dhead"><h2 id="cfTitle">このアイデアを削除しますか?</h2></div>
    <div class="dbody"><p class="plain">削除すると元に戻せません。Googleドライブに保存した画像も削除されます。</p></div>
    <div class="dfoot"><button class="btn" data-close type="button">キャンセル</button><button class="btn primary del" id="cfOk" type="button">削除する</button></div>
  </div>
</div>

<!-- フォルダの管理 -->
<div class="overlay" id="ovFolders" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="fmTitle">
    <div class="dhead"><h2 id="fmTitle">フォルダの管理</h2><button class="iconbtn" type="button" data-close aria-label="閉じる">✕</button></div>
    <div class="dbody">
      <p class="hint">▲▼で並び順を変えられます。名前を書き換えて「名前を変更」を押すと名前が変わります。すでにある名前にすると、2つのフォルダが1つにまとまります。</p>
      <div class="fmlist" id="fmList"></div>
      <div class="fmrow add">
        <input class="inp" id="fmNew" maxlength="30" placeholder="新しいフォルダ名" aria-label="新しいフォルダ名">
        <button type="button" class="btn primary" id="fmAdd">追加</button>
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="ovFolderDel" hidden>
  <div class="dialog small" role="alertdialog" aria-modal="true" aria-labelledby="fdTitle">
    <div class="dhead"><h2 id="fdTitle"></h2></div>
    <div class="dbody"><p class="plain" id="fdText"></p></div>
    <div class="dfoot"><button class="btn" data-close type="button">キャンセル</button><button class="btn primary del" id="fdOk" type="button">削除する</button></div>
  </div>
</div>

<!-- 同期の設定 -->
<div class="overlay" id="ovSync" hidden>
  <div class="dialog small" role="dialog" aria-modal="true" aria-labelledby="syTitle">
    <div class="dhead"><h2 id="syTitle">Googleドライブとの同期</h2><button class="iconbtn" type="button" data-close aria-label="閉じる">✕</button></div>
    <div class="dbody" id="syBody"></div>
    <div class="dfoot" id="syFoot"></div>
  </div>
</div>

<div class="lightbox" id="lb" hidden>
  <div class="lbbar"><span id="lbCount"></span><button class="iconbtn" type="button" id="lbClose" aria-label="閉じる">✕</button></div>
  <div class="lbstage" id="lbStage"><img id="lbImg" alt=""></div>
  <button class="lbnav prev" type="button" id="lbPrev" aria-label="前の画像">‹</button>
  <button class="lbnav next" type="button" id="lbNext" aria-label="次の画像">›</button>
</div>

<div id="printArea" class="printarea" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="app.js"></script>
</body>
</html>
